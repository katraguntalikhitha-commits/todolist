<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Todo List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==========================================
         AUTH SECTION
    =========================================== -->

    <div class="container auth-container" id="authContainer">

        <div class="auth-card">

            <div class="app-logo">
                ✓
            </div>

            <h1>My Todo List</h1>

            <p class="subtitle">
                Organize your tasks. Stay productive.
            </p>


            <!-- ==============================
                 LOGIN
            =============================== -->

            <div id="loginSection">

                <h2>Welcome Back 👋</h2>

                <p class="form-description">
                    Login to manage your personal tasks.
                </p>

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >


                <button
                    id="loginBtn"
                    class="primary-btn"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>


                <div class="switch-auth">

                    <span>
                        Don't have an account?
                    </span>

                    <button
                        id="showRegisterBtn"
                        class="link-btn"
                    >
                        Register
                    </button>

                </div>

            </div>


            <!-- ==============================
                 REGISTER
            =============================== -->

            <div
                id="registerSection"
                style="display: none;"
            >

                <h2>Create Account 🚀</h2>

                <p class="form-description">
                    Create your account and start organizing.
                </p>


                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >


                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >


                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                >


                <button
                    id="registerBtn"
                    class="primary-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>


                <div class="switch-auth">

                    <span>
                        Already have an account?
                    </span>

                    <button
                        id="showLoginBtn"
                        class="link-btn"
                    >
                        Login
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================
         TODO SECTION
    =========================================== -->

    <div
        class="container todo-container"
        id="todoContainer"
        style="display: none;"
    >

        <!-- Header -->

        <div class="todo-header">

            <div class="header-left">

                <div class="app-logo small-logo">
                    ✓
                </div>

                <div>

                    <h1>My Todo List</h1>

                    <p id="welcomeUser">
                        Welcome!
                    </p>

                </div>

            </div>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>


        <!-- ==============================
             ADD TODO
        =============================== -->

        <div class="todo-input">

            <input
                type="text"
                id="todoInput"
                placeholder="What do you need to accomplish?"
                autocomplete="off"
            >

            <button
                id="addTodoBtn"
                class="add-btn"
            >
                + Add Task
            </button>

        </div>


        <!-- ==============================
             LOADING
        =============================== -->

        <p id="loading">
            Loading your tasks...
        </p>


        <!-- ==============================
             TODO LIST
        =============================== -->

        <ul id="todoList"></ul>


        <!-- ==============================
             ERROR
        =============================== -->

        <p id="errorMessage"></p>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/script.js"></script>

</body>

</html>
